# =============================================================================
# Caller Workflow - Manual Vercel Deployment
# =============================================================================
# Source: Wamocon/github_workflow/examples/caller-production-deploy.yml
#
# Trigger : MANUAL ONLY - Actions tab → "Deploy to Vercel" → Run workflow
#           Choose "production" (live URL) or "preview" (test URL) at run time.
#           This workflow NEVER runs automatically.
#
# Secrets required:
#   - VERCEL_PROJECT_ID       → add this to your repo's GitHub secrets
#                               (Vercel Project → Settings → General → Project ID)
#   - SUPABASE_SERVICE_ROLE_KEY → Supabase service role key (bypasses RLS).
#                               Add to repo secrets so admin Server Actions work.
#
# Already set at organisation level (no action needed):
#   - VERCEL_TOKEN   → personal Vercel access token
#   - VERCEL_ORG_ID  → Vercel personal account ID
#
# How it works:
#   1. setup-vercel-env: injects SUPABASE_SERVICE_ROLE_KEY into the Vercel
#      project via the Vercel API (idempotent — safe to re-run).
#   2. deploy: builds and deploys via Vercel CLI (prebuilt).
#      NEXT_PUBLIC_* vars are committed in .env.production as a fallback.
# =============================================================================

name: Deploy to Vercel

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Deploy target"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      db_schema:
        description: "Optional NEXT_PUBLIC_DB_SCHEMA override (leave empty to use Vercel env vars)"
        required: false
        type: string
        default: ""

jobs:
  setup-vercel-env:
    name: Inject secrets into Vercel project
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set required env vars in Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [[ -z "$VERCEL_TOKEN" ]] || [[ -z "$VERCEL_PROJECT_ID" ]]; then
            echo "⚠ Skipping: VERCEL_TOKEN or VERCEL_PROJECT_ID not set."
            exit 0
          fi

          TARGET='["production","preview"]'

          # Fetch existing env vars once (used by upsert_var)
          EXISTING=$(curl -s \
            "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
            -H "Authorization: Bearer $VERCEL_TOKEN")

          # Upsert a single env var: create if new, patch if existing
          upsert_var() {
            local KEY="$1"
            local VALUE="$2"
            local TYPE="${3:-plain}"

            EXISTING_ID=$(echo "$EXISTING" | \
              jq -r ".envs[] | select(.key == \"$KEY\") | .id" 2>/dev/null | head -1)

            if [[ -n "$EXISTING_ID" ]] && [[ "$EXISTING_ID" != "null" ]]; then
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                -X PATCH "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env/$EXISTING_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "{\"value\":\"$VALUE\",\"type\":\"$TYPE\",\"target\":$TARGET}")
              echo "✓ $KEY updated (HTTP $HTTP)"
            else
              HTTP=$(curl -s -o /dev/null -w "%{http_code}" \
                -X POST "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H "Content-Type: application/json" \
                -d "[{\"key\":\"$KEY\",\"value\":\"$VALUE\",\"type\":\"$TYPE\",\"target\":$TARGET}]")
              echo "✓ $KEY created (HTTP $HTTP)"
            fi
          }

          # Public vars — safe to hardcode (Supabase anon key is designed to be public;
          # access control is enforced by Row Level Security on the database).
          upsert_var "NEXT_PUBLIC_SUPABASE_URL" \
            "https://gximupcgdkfibukwctrv.supabase.co"
          upsert_var "NEXT_PUBLIC_SUPABASE_ANON_KEY" \
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd4aW11cGNnZGtmaWJ1a3djdHJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg4NTkwOTksImV4cCI6MjA5NDQzNTA5OX0.Whl-EsTaNDjcwkualQjmMZGe4JQk9tvrdpXGbNrz9f8"
          upsert_var "SUPABASE_DB_SCHEMA" "public"
          upsert_var "NEXT_PUBLIC_APP_URL" "https://wamohub.vercel.app"

          # Secret var — only injected when SUPABASE_SERVICE_ROLE_KEY is configured
          # as a GitHub Secret in this repo.
          if [[ -n "$SERVICE_ROLE_KEY" ]]; then
            upsert_var "SUPABASE_SERVICE_ROLE_KEY" "$SERVICE_ROLE_KEY" "encrypted"
          else
            echo "⚠ SUPABASE_SERVICE_ROLE_KEY not set — admin features will not work."
            echo "  Add SUPABASE_SERVICE_ROLE_KEY to this repo's GitHub Secrets to enable them."
          fi

  deploy:
    name: Deploy - ${{ inputs.environment }}
    needs: [setup-vercel-env]
    if: always()
    uses: Wamocon/github_workflow/.github/workflows/deploy.yml@main
    with:
      vercel_env: ${{ inputs.environment }}
      db_schema: ${{ inputs.db_schema }}
    secrets: inherit

